    const engagingSummary = post => editorialSummaries[post.id] || cleanText(post.summary);
    const categories = [...new Set(posts.map(post => post.category))];
    const state = { category: "", kind: "", query: "", sort: "new", selected: posts[0].id };

    function node(tag, className, content) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (content !== undefined) element.textContent = content;
      return element;
    }

    function visiblePosts() {
      const query = state.query.trim().toLocaleLowerCase();
      return posts.filter(post =>
        (!state.category || post.category === state.category) &&
        (!state.kind || post.kind === state.kind) &&
        (!query || [post.title, post.summary, post.date, post.category, post.caution].some(value => value.toLocaleLowerCase().includes(query)))
      ).sort((a, b) => state.sort === "new" ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));
    }

    function renderNav() {
      const nav = byId("unit-nav");
      nav.replaceChildren();
      for (const category of ["", ...categories]) {
        const button = node("button", "unit-button", category || "全部貼文");
        button.type = "button";
        button.setAttribute("aria-current", category === state.category ? "page" : "false");
        button.append(node("span", "unit-count", String(category ? posts.filter(post => post.category === category).length : posts.length)));
        button.addEventListener("click", () => { state.category = category; render(); });
        nav.append(button);
      }
    }

    function renderList(items) {
      const list = byId("post-list");
      list.replaceChildren();
      byId("empty-state").hidden = items.length > 0;
      if (!items.some(post => post.id === state.selected)) state.selected = items[0] ? items[0].id : null;
      for (const post of items) {
        const button = node("button", "post-row");
        button.type = "button";
        button.setAttribute("aria-pressed", String(post.id === state.selected));
        button.append(node("span", "post-row-date", post.date.replaceAll("-", "/") + " · " + post.kind));
        button.append(node("strong", "post-row-title", post.title));
        button.append(node("span", "post-row-summary", engagingSummary(post)));
        const bottom = node("span", "post-row-bottom");
        bottom.append(node("span", "topic-label", post.category), node("span", "row-arrow", "↗"));
        button.append(bottom);
        button.addEventListener("click", () => {
          state.selected = post.id;
          renderList(items);
          renderDetail();
          if (window.matchMedia("(max-width: 1050px)").matches) document.querySelector(".detail").scrollIntoView({ behavior: "smooth" });
        });
        list.append(button);
      }
    }

    function renderDetail() {
      const container = byId("post-detail");
      container.replaceChildren();
      const post = posts.find(item => item.id === state.selected);
      if (!post) {
        container.append(node("p", "detail-placeholder", "請選擇一篇貼文。"));
        return;
      }
      const top = node("div", "detail-top");
      top.append(node("span", "detail-kicker", "貼文摘要 / " + post.category), node("time", "detail-date", post.date.replaceAll("-", "/")));
      const summary = engagingSummary(post);
      container.append(top, node("h2", "detail-title", post.title), node("p", "detail-summary", summary));
      const heading = node("h3", "detail-heading", "整理重點");
      const points = node("ul", "detail-points");
      for (const point of summary.split(/[；。]/).map(text => text.trim()).filter(Boolean)) {
        points.append(node("li", "", point));
      }
      if (post.related && post.related.length) points.append(node("li", "", "另有 " + post.related.length + " 則相關內容，連結見下方。"));
      container.append(heading, points);
      const tags = node("div", "tag-row");
      tags.append(node("span", "tag", post.kind), node("span", "tag", post.category));
      container.append(tags);
      const source = node("div", "source-block");
      source.append(node("span", "source-label", "來源 · Threads"));
      const links = node("div", "source-links");
      const allLinks = [[post.id, "閱讀原文 ↗"], ...(post.related || []).map(item => [item[0], cleanText(item[1]) + " ↗"])];
      for (const [id, label] of allLinks) {
        const link = node("a", "", label);
        link.href = postUrl(id);
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        links.append(link);
      }
      source.append(links);
      container.append(source);
    }

    function render() {
      const items = visiblePosts();
      byId("current-unit").textContent = state.category || "全部貼文";
      byId("unit-description").textContent = state.category ? "依主題整理相關串文與回覆；選取一篇可看摘要與原文。" : "依主題整理公開串文與回覆；選取一篇可看摘要與原文。";
      byId("result-count").textContent = items.length + " 篇";
      renderNav();
      renderList(items);
      renderDetail();
    }

    byId("source-count").textContent = posts.length + " 篇已整理";
    byId("search").addEventListener("input", event => { state.query = event.target.value; render(); });
    byId("kind").addEventListener("change", event => { state.kind = event.target.value; render(); });
    byId("sort").addEventListener("change", event => { state.sort = event.target.value; render(); });
    render();
  </script>
