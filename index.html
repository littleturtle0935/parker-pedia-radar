        reading = true;
        document.body.style.top = "-" + listScrollY + "px";
        document.body.classList.add("reading");
        for (const selector of [".results", ".sidebar", ".topbar"]) document.querySelector(selector).inert = true;
      }
      document.querySelector(".detail").scrollTop = 0;
      document.querySelector(".reader-back").focus({ preventScroll: true });
    }
    function hideReader() {
      if (!reading) return;
      reading = false;
      document.body.classList.remove("reading");
      document.body.style.top = "";
      for (const selector of [".results", ".sidebar", ".topbar"]) document.querySelector(selector).inert = false;
      window.scrollTo(0, listScrollY);
      if (opener && opener.isConnected) opener.focus({ preventScroll: true });
    }
    window.addEventListener("popstate", event => {
      const id = event.state && event.state.parkerArticle;
      if (id && mobileReader.matches && posts.some(post => post.id === id)) {
        state.selected = id;
        renderDetail();
        showReader();
      } else hideReader();
    });
    document.querySelector(".reader-back").addEventListener("click", () => {
      if (history.state && history.state.parkerArticle) history.back();
      else hideReader();
    });
    mobileReader.addEventListener("change", () => {
      if (!mobileReader.matches) hideReader();
    });

    function node(tag, className, content) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (content !== undefined) element.textContent = content;
      return element;
    }

    function visiblePosts() {
      const query = state.query.trim().toLocaleLowerCase();
      return posts.filter(post =>
        (!state.category || post.category === state.category) &&
        (!state.kind || post.kind === state.kind) &&
        (!state.viewType || viewingType(post) === state.viewType) &&
        (!query || [post.title, post.summary, post.date, post.category, post.caution, viewingType(post)].some(value => (value || "").toLocaleLowerCase().includes(query)))
      ).sort((a, b) => state.sort === "new" ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));
    }

    function viewingType(post) {
      const text = (post.title + " " + post.summary).toLocaleLowerCase();
      if (post.category === "動物與寵物") return "行為與動物";
      if (post.category === "運動與解剖") return "解剖與運動";
      if (post.category === "醫學爭點") return "觀點討論";
      if (post.category === "科技與資訊素養") return "科技思辨";
      if (post.category === "營養與代謝" || /衛教|糖尿病|尿酸|膽固醇|飲食|果糖|血糖|膳食|維生素|營養/.test(text)) return "衛教整理";
      if (post.category === "醫學研究") return "研究解讀";
      return "科普概念";
    }

    function renderNav() {
      const nav = byId("unit-nav");
      nav.replaceChildren();
      for (const category of ["", ...categories]) {
        const button = node("button", "unit-button", category || "全部貼文");
        button.type = "button";
        button.setAttribute("aria-current", category === state.category ? "page" : "false");
        button.append(node("span", "unit-count", String(category ? posts.filter(post => post.category === category).length : posts.length)));
        button.addEventListener("click", () => { state.category = category; render(); });
        nav.append(button);
      }
    }

    function renderList(items) {
      const list = byId("post-list");
      list.replaceChildren();
      byId("empty-state").hidden = items.length > 0;
      if (!items.some(post => post.id === state.selected)) state.selected = items[0] ? items[0].id : null;
      for (const post of items) {
        const copy = editorialCopy(post);
        const button = node("button", "post-row");
        button.type = "button";
        button.setAttribute("aria-pressed", String(post.id === state.selected));
        button.append(node("span", "post-row-date", post.date.replaceAll("-", "/") + " · " + post.kind));
        button.append(node("strong", "post-row-title", copy.title));
        button.append(node("span", "post-row-summary", copy.summary));
        const bottom = node("span", "post-row-bottom");
        bottom.append(node("span", "topic-label", post.category), node("span", "view-type-label", viewingType(post)), node("span", "row-arrow", "↗"));
        button.append(bottom);
        button.addEventListener("click", () => {
          state.selected = post.id;
          if (mobileReader.matches) {
            opener = button;
            for (const row of list.children) row.setAttribute("aria-pressed", String(row === button));
            renderDetail();
            history.pushState({ parkerArticle: post.id }, "", "#article=" + encodeURIComponent(post.id));
            showReader();
            return;
          }
          renderList(items);
          renderDetail();
        });
        list.append(button);
      }
    }

    function renderDetail() {
      const container = byId("post-detail");
      container.replaceChildren();
      const post = posts.find(item => item.id === state.selected);
      if (!post) {
        container.append(node("p", "detail-placeholder", "請選擇一篇貼文。"));
        return;
      }
      const top = node("div", "detail-top");
      top.append(node("span", "detail-kicker", "貼文摘要 / " + post.category + " · " + viewingType(post)), node("time", "detail-date", post.date.replaceAll("-", "/")));
      const copy = editorialCopy(post);
      container.append(top, node("h2", "detail-title", copy.title), node("p", "detail-summary", copy.summary));
      const heading = node("h3", "detail-heading", "整理重點");
      const points = node("ul", "detail-points");
      for (const point of copy.points) {
        points.append(node("li", "", point));
      }
      if (post.related && post.related.length) points.append(node("li", "", "另有 " + post.related.length + " 則相關內容，連結見下方。"));
      container.append(heading, points);
      const tags = node("div", "tag-row");
      tags.append(node("span", "tag", post.kind), node("span", "tag", post.category), node("span", "tag", "觀影類型：" + viewingType(post)));
      container.append(tags);
      const source = node("div", "source-block");
      source.append(node("span", "source-label", "來源 · Threads"));
      const links = node("div", "source-links");
      const allLinks = [[post.id, "閱讀原文 ↗"], ...(post.related || []).map(item => [item[0], cleanText(item[1]) + " ↗"])];
      for (const [id, label] of allLinks) {
        const link = node("a", "", label);
        link.href = postUrl(id);
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        links.append(link);
      }
      source.append(links);
      container.append(source);
    }

    function render() {
      const items = visiblePosts();
      byId("current-unit").textContent = state.category || "全部貼文";
      byId("unit-description").textContent = state.category ? "依主題整理相關串文與回覆；選取一篇可看摘要與原文。" : "依主題整理公開串文與回覆；選取一篇可看摘要與原文。";
      byId("result-count").textContent = items.length + " 篇";
      renderNav();
      renderList(items);
      renderDetail();
    }

    byId("source-count").textContent = posts.length + " 篇已整理";
    byId("search").addEventListener("input", event => { state.query = event.target.value; render(); });
    byId("kind").addEventListener("change", event => { state.kind = event.target.value; render(); });
    byId("view-type").addEventListener("change", event => { state.viewType = event.target.value; render(); });
    byId("sort").addEventListener("change", event => { state.sort = event.target.value; render(); });
    const workspace = document.querySelector(".workspace");
    const columnDefaults = { sidebar: 240, results: 440 };
    const columnMinimums = { sidebar: 190, results: 320 };
    let columnWidths = { ...columnDefaults };

    try {
      columnWidths = { ...columnWidths, ...JSON.parse(localStorage.getItem("parker-column-widths") || "{}") };
    } catch {}

    function columnLimit(name) {
      const other = name === "sidebar" ? "results" : "sidebar";
      return Math.max(columnMinimums[name], workspace.clientWidth - columnWidths[other] - 362);
    }

    function setColumnWidth(name, value, save = false) {
      const width = Math.round(Math.min(columnLimit(name), Math.max(columnMinimums[name], value)));
      columnWidths[name] = width;
      workspace.style.setProperty(`--${name}-width`, `${width}px`);
      if (save) localStorage.setItem("parker-column-widths", JSON.stringify(columnWidths));
    }

    for (const name of Object.keys(columnWidths)) setColumnWidth(name, columnWidths[name]);
    for (const handle of document.querySelectorAll(".column-resizer")) {
      const name = handle.dataset.column;
      handle.addEventListener("pointerdown", event => {
        if (!matchMedia("(min-width: 1051px)").matches) return;
        const startX = event.clientX;
        const startWidth = columnWidths[name];
        handle.setPointerCapture(event.pointerId);
        handle.setAttribute("aria-pressed", "true");
        document.body.classList.add("is-resizing");
        const move = moveEvent => setColumnWidth(name, startWidth + moveEvent.clientX - startX);
        const stop = () => {
          handle.removeEventListener("pointermove", move);
          handle.removeEventListener("pointerup", stop);
          handle.removeEventListener("pointercancel", stop);
          handle.setAttribute("aria-pressed", "false");
          document.body.classList.remove("is-resizing");
          localStorage.setItem("parker-column-widths", JSON.stringify(columnWidths));
        };
        handle.addEventListener("pointermove", move);
        handle.addEventListener("pointerup", stop);
        handle.addEventListener("pointercancel", stop);
      });
      handle.addEventListener("keydown", event => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        event.preventDefault();
        setColumnWidth(name, columnWidths[name] + (event.key === "ArrowRight" ? 16 : -16), true);
      });
      handle.addEventListener("dblclick", () => setColumnWidth(name, columnDefaults[name], true));
    }
    window.addEventListener("resize", () => {
      for (const name of Object.keys(columnWidths)) setColumnWidth(name, columnWidths[name]);
    });
    render();
  </script>
</body>
</html>
